<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MSM API Local Test</title>
</head>
<body>
    <h1>Check your Developer Console (F12)</h1>
    <img id="monster-img" width="200" />
    
    <script src="./dist/msm.js"></script>
    <script>
        async function runTests() {
            console.log("Fetching Master Database & Assembling...");
            
            // Test 1: Standard Monster Lookup
            const mammott = await MSM["Cruv'laaphtian Crocus"];
            console.log("🐘 Mammott Object:", mammott);
            console.log("💰 Cost:", mammott.cost);
            console.log("🔥 Elements:", mammott.elements);
            
            // Test visual loading method
            if(mammott) await mammott.loadImage('monster-img');

            // Test 2: Rare/Epic Lookup & Array handling
            const rareGhazt = await MSM.Rare_Ghazt;
            console.log("👻 Rare Ghazt Object:", rareGhazt);
            console.log("👕 Costumes Available:", rareGhazt.costumes.length);

            // Test 3: Breeding Calculator
            const breeding = await MSM.twoMonsterCombo("Entbrat + Bowgart");
            console.log("🥚 Breeding Combo:", breeding);
        }

        runTests();
    </script>
</body>
</html>
